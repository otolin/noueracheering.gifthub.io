<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ミラク｜NouerA FAN PAGE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d0000; color: #e0e0e0; font-family: 'Helvetica Neue', sans-serif; font-weight: 700; }
    header { background: #0d0000; border-bottom: 2px solid #cc0000; padding: 16px 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; }
    header a { color: #ff6666; text-decoration: none; font-size: 0.85em; letter-spacing: 0.1em; }
    header a:hover { color: #fff; }
    header span { color: #440000; }
    header h1 { color: #fff; font-size: 1.1em; letter-spacing: 0.2em; }
    .profile { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .profile-top { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 40px; }
    .profile-top img { width: 140px; aspect-ratio: 3/4; object-fit: cover; object-position: top; border-radius: 6px; border: 1px solid #440000; flex-shrink: 0; }
    .profile-info { flex: 1; }
    .profile-name { font-size: 2em; color: #fff; letter-spacing: 0.1em; margin-bottom: 6px; }
    .profile-name-sub { font-size: 0.85em; color: #ff6666; letter-spacing: 0.2em; margin-bottom: 16px; font-weight: 400; }
    .profile-table { width: 100%; border-collapse: collapse; }
    .profile-table tr { border-bottom: 1px solid #1e0000; }
    .profile-table td { padding: 8px 4px; font-size: 0.82em; }
    .profile-table td:first-child { color: #aa3333; min-width: 70px; font-weight: 400; }
    .profile-table td:last-child { color: #e0e0e0; font-weight: 400; }
    h2 { font-size: 1.1em; letter-spacing: 0.2em; color: #ff2222; border-left: 4px solid #ff0000; padding-left: 12px; margin-bottom: 16px; text-transform: uppercase; }
    .photo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 50px; }
    .photo-grid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; object-position: top; display: block; border-radius: 4px; border: 1px solid #2a0000; cursor: pointer; transition: opacity 0.2s, border-color 0.2s; }
    .photo-grid img:hover { opacity: 0.8; border-color: #ff0000; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 300; align-items: center; justify-content: center; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 92vw; max-height: 88vh; object-fit: contain; border-radius: 4px; }
    .lightbox-close { position: absolute; top: 16px; right: 20px; background: none; border: none; color: #ff4444; font-size: 1.8em; cursor: pointer; }
    footer { text-align: center; padding: 40px 20px; color: #442222; font-size: 0.8em; border-top: 1px solid #1e0000; margin-top: 20px; font-weight: 400; }
  </style>
</head>
<body>
<header>
  <a href="index.html">← BACK</a>
  <span>/</span>
  <h1>ミラク</h1>
</header>
<div class="profile">
  <div class="profile-top">
    <img src="IMG_7915.jpeg" alt="ミラク">
    <div class="profile-info">
      <div class="profile-name">ミラク</div>
      <div class="profile-name-sub">MIRAKU　／　NouerA</div>
      <table class="profile-table">
        <tr><td>生年月日</td><td>2008年2月13日</td></tr>
        <tr><td>出身</td><td>🇯🇵 日本</td></tr>
      </table>
    </div>
  </div>
  <h2>Photos</h2>
  <div class="photo-grid">
    <img src="IMG_7934.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7941.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7948.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7955.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7962.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7969.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7976.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7983.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7990.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
    <img src="IMG_7997.jpeg" alt="ミラク" onclick="openLightbox(this.src)">
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
</div>
<footer>© 2025 NouerA FAN PAGE　／　This is an unofficial fan site.</footer>
<script>
function openLightbox(src) { document.getElementById("lightbox-img").src = src; document.getElementById("lightbox").classList.add("open"); document.body.style.overflow = "hidden"; }
function closeLightbox() { document.getElementById("lightbox").classList.remove("open"); document.body.style.overflow = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });
</script>
</body>
</html>
